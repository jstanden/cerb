; PHP-FPM pool for the BACKGROUND container role (CERB_FPM_POOL=background).
;
; Only ever one pool runs per container -- entry.sh installs exactly the one named
; by CERB_FPM_POOL into pool.d/. This file and www.conf never coexist. They are
; separate files because the tuning genuinely differs, not because they arbitrate.
;
; The workload here is one blocking curl_exec bracketed by a few DB writes: a drain
; worker makes ONE provider round trip per queue message and spends nearly the whole
; hold parked in curl. So this pool is memory- and connection-bound, never CPU-bound.

[global]
error_log = /proc/self/fd/2

[background]
user = www-data
group = www-data
listen = 9000

; `static`, same as the web pool -- one knob, and a knowable memory ceiling
; (children x memory_limit). Children well in excess of core count is correct HERE
; though, unlike there: this work is blocked on outbound HTTP, not on CPU.
pm = static
pm.max_children = ${CERB_BACKGROUND_CHILDREN}

; Recycle children periodically -- long-lived drains accumulate more than a page
; load does, and nothing here depends on a warm process.
pm.max_requests = 200

; ONE TURNOVER deep. At the 511 default a saturated pool queues silently and a request
; can sit for minutes before answering 200, which reads as "slow" rather than "full".
; Past one turnover a request is waiting rather than running, and waiting is the outcome
; this whole split exists to avoid -- refuse it and let the caller retry.
;
; This bounds how DEEP the silent queue gets; it does NOT refuse at the child count.
; The accept queue holds this many waiters ON TOP OF what the children already took, so
; nothing is refused until roughly `children + backlog` are in flight -- everything below
; that waits under fastcgi_read_timeout. `children = 1` is NOT a saturation test:
; measured with 1 child and backlog 1, three concurrent 30s requests were all served
; serially, none refused.
listen.backlog = ${CERB_BACKGROUND_CHILDREN}

; A terminate is a SIGTERM: ignore_user_abort() cannot survive it and it skips
; DevblocksPlatform::shutdown() entirely, so queue()->publish(), metrics()->publish()
; and registry()->save() never flush and acks are LOST. An LLM turn can legitimately
; run 900s, so this pool must never reap one.
request_terminate_timeout = 0

; NO slowlog here, deliberately. There is no duration that is "slow" for a drain: a turn takes as
; long as the model takes, and a deep-thinking local model runs for minutes as a matter of course.
; The access log below already reports every request's duration, so the only thing slowlog would add
; is a backtrace -- which needs SYS_PTRACE (Docker's default seccomp blocks it, and FPM logs a
; ptrace(ATTACH) ERROR for every slow request when it cannot) and would always point at the same
; blocking curl call anyway.

; Unlike the web pool, log every request WITH its duration -- %{milli}d is what makes
; drain durations directly readable while tuning the pool size.
access.log = /proc/self/fd/2
; %r is post-rewrite (/index.php for everything), so log REQUEST_URI -- nginx passes
; the ORIGINAL path in it. Without this you cannot tell a nextAgentTurn from a
; drainJob in the log, which defeats the point of logging durations at all.
access.format = "%R - %t \"%m %{REQUEST_URI}e\" %s %{milli}d ms %{kilo}M kB"

catch_workers_output = yes
php_flag[display_errors] = off
php_admin_value[post_max_size] = 64M
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Higher than the web pool: an agent turn holds a whole transcript in memory.
php_admin_value[memory_limit] = 256M
