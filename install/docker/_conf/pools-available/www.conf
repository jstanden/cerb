; PHP-FPM pool for the WEB container role (CERB_FPM_POOL=www).
;
; Only ever one pool runs per container -- entry.sh installs exactly the one named
; by CERB_FPM_POOL into pool.d/. This file and background.conf never coexist. They
; are separate files because the tuning genuinely differs, not because they arbitrate.
;
; The workload here is page loads and ajax: milliseconds, CPU- and DB-bound, bursty.
; Drains (/queue, /cron) are routed away to the background pool precisely so a
; 900-second agent turn can never occupy one of these children.

[global]
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = 9000

; `static`, like the background pool: max_children is then the ONLY knob, and setting
; it to 1 for testing needs no other edit. `dynamic` also needs start_servers and
; min/max_spare_servers, and FPM REFUSES TO START when those contradict max_children.
;
; A fixed count also makes the memory ceiling knowable (children x memory_limit), which
; is how you size a container. These are RESIDENT, so lower it on a small box.
pm = static
pm.max_children = ${CERB_WEB_CHILDREN}

; Recycle children periodically so a slow leak in any one request cannot accumulate.
pm.max_requests = 500

; NOT SET, deliberately -- do not "match" this to background.conf. Unset means FPM
; never kills a request of its own accord, which /update depends on: it runs
; @set_time_limit(3600) and legitimately outlives the browser that started it.
;request_terminate_timeout =

; Off: page loads are uniform and high-volume, and nothing here needs tuning per request. The
; background pool logs its own because per-drain DURATION is what you size that pool on.
;
; To trace a client's ajax traffic, point this at /proc/self/fd/2 with the background pool's
; format -- %r is POST-rewrite (/index.php for everything), so REQUEST_URI is what carries the
; `?_log=` action name that distinguishes one poll from another.
access.log = /dev/null

catch_workers_output = yes
php_flag[display_errors] = off
php_admin_value[post_max_size] = 64M
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
