# ---------------------------------------------------------------------------
# Main nginx config. Rendered by the image's own envsubst entrypoint (see
# NGINX_ENVSUBST_OUTPUT_DIR in docker-compose.yml) and mounted over
# /etc/nginx/nginx.conf.
#
# This file exists so `worker_processes` can come from the environment: it is a
# main-context directive, and the server block in this directory renders into
# conf.d/, which is included from INSIDE `http { }` where nginx rejects it.
#
# Only worker_processes and the two log destinations differ from the stock nginx.conf.
# Everything else is the image default, kept verbatim so the diff stays obvious.
# ---------------------------------------------------------------------------

user  nginx;

# One worker per visible core (`auto`, the stock value) is a lot of processes for a
# tier that does nothing but proxy to FPM -- on a laptop that is every core the Docker
# VM was given. Real concurrency is capped downstream by CERB_WEB_CHILDREN.
worker_processes  ${CERB_NGINX_WORKERS};

# Straight to the container's stdout/stderr, which is where `docker compose logs` and
# every log driver read from. The image already symlinks /var/log/nginx/{access,error}.log
# to these, so this only makes the intent visible -- and survives a volume mounted over
# /var/log/nginx, which would otherwise bury the logs in the container.
error_log  /dev/stderr notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Off in the server block by default -- see default.conf.
    access_log  /dev/stdout  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
