# ---------------------------------------------------------------------------
# Background routing
#
# `/queue` and `/cron` are DRAINS: one request can hold a PHP child for the whole
# length of an LLM agent turn (up to 900s). Everything else is a page load that
# should answer in milliseconds. Keeping them off each other's children is the
# entire point of this block.
#
# Drains get their own container (`php-fpm-background`), so the split is real: a
# drain cannot occupy a child a page load needed. Point CERB_FPM_BACKGROUND back at
# `php-fpm:9000` to collapse to one pool.
#
# Backpressure is mostly the APP's job: a drain that cannot get a concurrency slot
# answers 529 itself, which is the layer that survives once this reference is replaced
# by a real load balancer. This file only translates an outright refusal from the pool
# into the same 529, so a caller needs one rule.
#
# Matched on $request_uri, the ORIGINAL URI, because the decision has to be made
# before `location /` rewrites everything to /index.php. It deliberately does NOT
# look at `c=` / `a=` query args: those are client-supplied, so routing on them
# would let any caller steer itself onto the background pool. A path prefix is the
# canonical routing dimension and the app's own URLs are path-shaped
# (DEVBLOCKS_REWRITE is always on in this image).
# ---------------------------------------------------------------------------

map $request_uri $cerb_fpm_backend {
    default                    "php-fpm:9000";
    "~^/(queue|cron)(/|\?|$)"  "${CERB_FPM_BACKGROUND}";
}

# Same test, as a flag: the PHP location is matched AFTER `location /` rewrites
# everything to /index.php, so by then it cannot tell a drain from a page load. The
# error handler reads this to decide whether a refusal means "busy" or "broken".
map $request_uri $cerb_is_background {
    default                    0;
    "~^/(queue|cron)(/|\?|$)"  1;
}

# Runtime DNS. REQUIRED, because fastcgi_pass takes a variable below: nginx would
# otherwise resolve the upstream once at config load and pin a single container's
# IP, which silently breaks `--scale php-fpm-background=N` (every request lands on
# replica 1). 127.0.0.11 is Docker's embedded resolver.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name localhost;
    error_log /dev/stderr;
    # Uncomment to see page loads in `docker compose logs`. Off by default because a
    # single page load is dozens of asset requests.
    #access_log /dev/stdout main;
    access_log off;

    root /usr/share/nginx/html;
    index index.php;

    # Must not be BELOW php's post_max_size / upload_max_filesize (64M in the pool
    # files), or nginx rejects at half what the app advertises.
    client_max_body_size 64m;
    charset utf-8;

    #resolver 8.8.8.8 valid=300s;
    #resolver_timeout 5s;

    # allow static resources
    location = /apple-touch-icon.png {
        allow all;
        expires 1d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /apple-touch-icon-precomposed.png {
        return 404;
    }

    location = /favicon.ico {
        allow all;
        expires 1d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        allow all;
        expires 1d;
        access_log off;
        add_header Cache-Control "public";
    }

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    location ~ ^/(index|ajax)\.php$ {
        root /var/www/html;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   $cerb_fpm_backend;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;

        # CONNECTING is fast even when the WORK is slow -- these are containers on one
        # network, so a connect that has not completed in two seconds is not going to.
        # A full listen backlog shows up here (the kernel drops the SYN, so nginx waits
        # out this timeout), which is why the default 60s is far too patient: it turns a
        # refusal into a minute of silence.
        fastcgi_connect_timeout 2s;

        # The WORK, separately. A drain deliberately outlives a normal page load; the app
        # relies on ignore_user_abort(true) and finishes even if the client hangs up.
        fastcgi_read_timeout 900s;

        # A connect timeout means the accept queue is full (the kernel drops the SYN,
        # so nginx waits out fastcgi_connect_timeout above); a read timeout means a drain
        # outran 900s. Both are 504, and both mean "come back later" on a background path.
        #
        # 502 is deliberately NOT here. It means refused / socket missing / pool dead, and
        # dressing that as `{"throttled":true}` with a Retry-After makes a total outage
        # read as a busy pool to every client and every log line.
        #
        # This rests on tcp_abort_on_overflow = 0, the Linux default. At 1 the kernel RSTs
        # a full accept queue instead of dropping the SYN, which reaches nginx as 502 --
        # and saturation would stop being refused here.
        error_page 504 = @cerb_upstream_refused;
    }

    # A refusal on a background path is BACKPRESSURE, and the contract is that a drain
    # may be refused at any time: every caller retries, and the work is durable because
    # a refused drain leaves its queue messages AVAILABLE.
    #
    # That covers a read timeout too. A drain that outran the 900s read timeout is still
    # running in PHP and will finish -- nginx stopped waiting, the work did not -- and its
    # messages stay claimed, so a caller that retries cannot double-run them. "Come back
    # later" is the honest answer to all of it.
    #
    # On any other path a 504 means a user's page load timed out, and it passes through
    # with its own status.
    #
    # `return` is the one directive that is safe inside `if` (nginx's own guidance), so
    # nothing else goes in there.
    location @cerb_upstream_refused {
        internal;
        default_type application/json;
        add_header Retry-After 5 always;

        if ($cerb_is_background) {
            return 529 '{"throttled":true,"reason":"No background capacity"}';
        }

        return 504;
    }

    # Allow installation
    location /install/ {
        location = /install/ {
            rewrite ^ /install/index.php last;
        }

        # Route PHP requests to FPM
        location ~ ^/install/(index|servercheck|phpinfo)\.php$ {
            root /var/www/html;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass   php-fpm:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        }
    }

    # deny all other PHP file requests
    location ~ /\.php$ {
        deny all;
    }

    # Redirect everything else to the front controller
    location / {
        rewrite ^ /index.php last;
    }
}